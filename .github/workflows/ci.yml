name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        deps: [latest]
        include:
          # Verifies the declared dependency floors in pyproject.toml still work.
          - python-version: '3.10'
            deps: minimum
    name: test (py${{ matrix.python-version }}, ${{ matrix.deps }} deps)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pin dependency floors
        if: matrix.deps == 'minimum'
        run: python -m pip install 'google-api-python-client==2.181.0' 'google-auth==2.41.0'
      - run: python -m pip install -e '.[dev]'
      # Live tests skip themselves: no Google credentials are configured in CI.
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
