[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myb-google-sheets-api"
version = "1.1.0"
description = "Python library for communicating with the Google Sheets API"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Mine Your Business", email = "mine.your.business.crypto@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.181.0,<3",
    "google-auth>=2.41.0,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "cryptography>=42",
    "pytest>=8",
    "ruff>=0.13",
]

[project.urls]
Homepage = "https://github.com/mine-your-business/myb-google-sheets-api"
Issues = "https://github.com/mine-your-business/myb-google-sheets-api/issues"

[tool.setuptools.packages.find]
include = ["sheets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Google Sheets API; skipped unless credentials are configured"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
